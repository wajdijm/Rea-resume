<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réanimation — Plateforme de Révision Médicale</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=Lora:ital,wght@0,400;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--s1:#0e1220;--s2:#161b2e;--s3:#1d2340;--b1:rgba(99,179,237,.12);--b2:rgba(99,179,237,.25);--a1:#63b3ed;--a2:#f6ad55;--a3:#68d391;--a4:#fc8181;--a5:#b794f4;--a6:#76e4f7;--tx:#e2e8f0;--tx2:#a0aec0;--mt:#4a5568}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:'DM Mono',monospace;min-height:100vh;overflow-x:hidden;font-size:14px}
body::before{content:'';position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(99,179,237,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(99,179,237,.025) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
body::after{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 70% 50% at 15% 10%,rgba(99,179,237,.07) 0%,transparent 60%),radial-gradient(ellipse 50% 70% at 85% 90%,rgba(183,148,244,.07) 0%,transparent 60%);pointer-events:none}

/* HEADER */
header{position:sticky;top:0;z-index:200;background:rgba(7,9,15,.93);backdrop-filter:blur(24px);border-bottom:1px solid var(--b1);padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:.95rem;color:var(--a1);display:flex;align-items:center;gap:10px}
.pulse{width:8px;height:8px;background:var(--a4);border-radius:50%;animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(252,129,129,.5)}50%{box-shadow:0 0 0 7px rgba(252,129,129,0)}}
.hdr-r{display:flex;align-items:center;gap:10px}
.sc-badge{font-size:.68rem;color:var(--a3);border:1px solid rgba(104,211,145,.3);padding:3px 10px;border-radius:20px}
.prog-wrap{width:100px;height:3px;background:var(--s3);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--a1),var(--a5));border-radius:2px;transition:width .5s;width:0%}

/* HERO */
.hero{position:relative;z-index:1;padding:4rem 2rem 2rem;text-align:center;max-width:860px;margin:0 auto}
.hero-eye{font-size:.62rem;letter-spacing:3px;text-transform:uppercase;color:var(--a1);margin-bottom:.8rem;opacity:.8}
.hero-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(2rem,5vw,3.2rem);line-height:1.05;letter-spacing:-2px;background:linear-gradient(135deg,#fff 30%,var(--a1) 70%,var(--a5) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.8rem}
.hero-sub{font-size:.82rem;color:var(--tx2);line-height:1.7;max-width:500px;margin:0 auto 2rem;font-family:'Lora',serif;font-style:italic}

/* COURSE GRID */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.9rem;padding:0 1.5rem 1.5rem;position:relative;z-index:1;max-width:1200px;margin:0 auto}
.ccard{background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:1.2rem;cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}
.ccard::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.015));pointer-events:none}
.ccard:hover{transform:translateY(-4px) scale(1.02);border-color:var(--cc,var(--a1));box-shadow:0 12px 40px rgba(0,0,0,.4),0 0 0 1px var(--cc,var(--a1))}
.ccard.active{border-color:var(--cc,var(--a1));background:var(--s2);box-shadow:0 0 0 1px var(--cc,var(--a1))}
.ccard-icon{font-size:1.7rem;margin-bottom:.7rem;display:block}
.ccard-num{font-size:.58rem;letter-spacing:2px;color:var(--cc,var(--a1));text-transform:uppercase;margin-bottom:.25rem;opacity:.8}
.ccard-title{font-family:'Syne',sans-serif;font-weight:700;font-size:.82rem;line-height:1.3;color:var(--tx)}
.ccard-prog{height:2px;background:var(--s3);border-radius:1px;margin-top:.9rem;overflow:hidden}
.ccard-prog-f{height:100%;background:var(--cc,var(--a1));border-radius:1px;width:0%;transition:width .5s}

/* MAIN */
.main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 1.5rem 4rem}

/* EMPTY */
.empty{text-align:center;padding:5rem 2rem;color:var(--tx2);position:relative;z-index:1}
.empty-icon{font-size:3rem;margin-bottom:1rem}
.empty-title{font-family:'Syne',sans-serif;font-size:1.1rem;margin-bottom:.4rem;color:var(--tx)}
.empty-sub{font-size:.78rem}

/* COURSE HEADER */
.ch{display:flex;align-items:flex-start;gap:1rem;margin-bottom:1.2rem}
.ch-icon{font-size:2.2rem;flex-shrink:0;line-height:1}
.ch h2{font-family:'Syne',sans-serif;font-weight:800;font-size:1.35rem;letter-spacing:-.5px}
.ch .sub{font-size:.73rem;color:var(--tx2);margin-top:3px;font-style:italic;font-family:'Lora',serif}

/* TABS */
.tabs{display:flex;gap:4px;background:var(--s1);border:1px solid var(--b1);border-radius:10px;padding:4px;margin-bottom:1.2rem;overflow-x:auto}
.tbtn{flex:1;min-width:90px;padding:7px 14px;border:none;border-radius:7px;background:transparent;color:var(--tx2);font-family:'DM Mono',monospace;font-size:.7rem;cursor:pointer;transition:all .2s;white-space:nowrap}
.tbtn:hover{color:var(--tx);background:var(--s2)}
.tbtn.active{background:var(--s3);color:var(--a1)}

/* PANELS */
.panel{display:none}
.panel.active{display:block;animation:fsi .35s ease}
@keyframes fsi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* CONTENT GRID */
.cgr{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin-bottom:1rem}
@media(max-width:680px){.cgr{grid-template-columns:1fr}}
.cb{background:var(--s1);border:1px solid var(--b1);border-radius:12px;padding:1.1rem}
.cb.fw{grid-column:1/-1}
.bt{font-family:'Syne',sans-serif;font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:.7rem;display:flex;align-items:center;gap:7px}
.bt::before{content:'';width:3px;height:12px;background:var(--a1);border-radius:2px;flex-shrink:0}

/* LIST */
.il{list-style:none;display:flex;flex-direction:column;gap:5px}
.il li{font-size:.76rem;color:var(--tx2);line-height:1.5;padding:6px 10px;background:var(--s2);border-radius:6px;border-left:2px solid var(--a1);transition:border-color .2s}
.il li:hover{border-left-color:var(--a2);color:var(--tx)}

/* TABLE */
.stbl{width:100%;border-collapse:collapse;font-size:.73rem}
.stbl th,.stbl td{padding:7px 11px;text-align:left;border-bottom:1px solid var(--b1)}
.stbl th{color:var(--a1);font-weight:600;font-size:.65rem;text-transform:uppercase;letter-spacing:1px}
.stbl td{color:var(--tx2)}
.stbl tr:hover td{color:var(--tx);background:rgba(255,255,255,.015)}

/* SCHEMA */
.schema{background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:1.1rem;font-size:.76rem;line-height:2;color:var(--tx2)}
.schema .ar{color:var(--a1)}
.schema .kw{color:var(--a3);font-weight:500}
.schema .dk{color:var(--a4)}
.schema .wk{color:var(--a2)}

/* TAGS */
.tag{display:inline-block;font-size:.62rem;padding:2px 8px;border-radius:20px;margin:2px;font-weight:500;letter-spacing:.5px}
.tb{background:rgba(99,179,237,.12);color:var(--a1);border:1px solid rgba(99,179,237,.25)}
.to{background:rgba(246,173,85,.12);color:var(--a2);border:1px solid rgba(246,173,85,.25)}
.tg{background:rgba(104,211,145,.12);color:var(--a3);border:1px solid rgba(104,211,145,.25)}
.tr{background:rgba(252,129,129,.12);color:var(--a4);border:1px solid rgba(252,129,129,.25)}
.tp{background:rgba(183,148,244,.12);color:var(--a5);border:1px solid rgba(183,148,244,.25)}

/* HIGHLIGHT */
.hl{background:rgba(99,179,237,.05);border:1px solid rgba(99,179,237,.18);border-radius:8px;padding:9px 13px;font-size:.76rem;line-height:1.6;color:var(--tx2);margin:5px 0}
.hl.warn{background:rgba(246,173,85,.05);border-color:rgba(246,173,85,.18)}
.hl.danger{background:rgba(252,129,129,.05);border-color:rgba(252,129,129,.18)}
.hl.ok{background:rgba(104,211,145,.05);border-color:rgba(104,211,145,.18)}

/* FORMULA */
.fcard{background:linear-gradient(135deg,var(--s2),var(--s3));border:1px solid rgba(246,173,85,.2);border-radius:10px;padding:1rem;margin:5px 0}
.ftit{font-size:.62rem;letter-spacing:2px;text-transform:uppercase;color:var(--a2);margin-bottom:.4rem}
.fbody{font-family:'Lora',serif;font-size:.95rem;color:var(--tx);text-align:center;padding:.4rem;background:rgba(0,0,0,.2);border-radius:7px}

/* GCS */
.gcs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
@media(max-width:600px){.gcs-grid{grid-template-columns:1fr}}
.gcs-sec{background:var(--s1);border:1px solid var(--b1);border-radius:9px;padding:.9rem}
.gcs-stit{font-size:.65rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--a1);margin-bottom:.6rem}
.gcs-row{display:flex;align-items:center;justify-content:space-between;padding:5px 7px;border-radius:5px;cursor:pointer;transition:background .2s;font-size:.72rem;color:var(--tx2)}
.gcs-row:hover{background:var(--s2);color:var(--tx)}
.gcs-row.sel{background:rgba(99,179,237,.1);color:var(--a1)}
.gcs-badge{font-size:.62rem;background:var(--s3);padding:2px 7px;border-radius:9px}
.gcs-total{margin-top:.9rem;text-align:center;padding:.9rem;background:var(--s1);border:1px solid var(--b1);border-radius:9px}
.gcs-num{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800}
.gcs-lbl{font-size:.68rem;color:var(--tx2);margin-top:3px}
.c-sev{color:var(--a4)}.c-mod{color:var(--a2)}.c-ok{color:var(--a3)}

/* FLASHCARDS */
.fc-wrap{perspective:1200px;margin:0 auto}
.fc{position:relative;width:100%;height:260px;cursor:pointer;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.4,0,.2,1)}
.fc.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.8rem;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fc-front{background:linear-gradient(135deg,var(--s2),var(--s3));border:1px solid var(--b2)}
.fc-back{background:linear-gradient(135deg,var(--s3),rgba(99,179,237,.08));border:1px solid rgba(99,179,237,.28);transform:rotateY(180deg)}
.fc-lbl{font-size:.6rem;letter-spacing:3px;text-transform:uppercase;color:var(--a1);margin-bottom:.9rem;opacity:.8}
.fc-q{font-family:'Lora',serif;font-size:1rem;line-height:1.5;color:var(--tx);font-style:italic}
.fc-a{font-size:.82rem;line-height:1.7;color:var(--tx2)}
.fc-a strong{color:var(--a3)}
.fc-hint{margin-top:.9rem;font-size:.62rem;color:var(--mt);letter-spacing:1px}
.fc-nav{display:flex;align-items:center;justify-content:space-between;margin-top:.9rem;gap:.8rem}
.fc-ctr{font-size:.68rem;color:var(--mt);min-width:55px;text-align:center}
.fc-btns{display:flex;gap:7px;margin-top:.9rem;justify-content:center}

/* BUTTONS */
.btn{padding:7px 18px;border-radius:7px;border:none;cursor:pointer;font-family:'DM Mono',monospace;font-size:.72rem;transition:all .2s;display:inline-flex;align-items:center;gap:5px}
.btn-p{background:var(--a1);color:var(--bg);font-weight:600}
.btn-p:hover{background:#90cdf4;transform:translateY(-1px)}
.btn-sec{background:var(--s2);color:var(--tx2);border:1px solid var(--b1)}
.btn-sec:hover{color:var(--tx);background:var(--s3)}
.btn-ok{background:rgba(104,211,145,.12);color:var(--a3);border:1px solid rgba(104,211,145,.28)}
.btn-ok:hover{background:rgba(104,211,145,.22)}
.btn-ko{background:rgba(252,129,129,.12);color:var(--a4);border:1px solid rgba(252,129,129,.28)}
.btn-ko:hover{background:rgba(252,129,129,.22)}

/* QCM */
.qcm-hd{display:flex;align-items:center;gap:11px;padding:11px 15px;background:var(--s1);border-radius:9px;border:1px solid var(--b1);margin-bottom:1rem;font-size:.73rem;color:var(--tx2)}
.qcm-score-n{font-family:'Syne',sans-serif;font-size:1.2rem;color:var(--a3);font-weight:700}
.qcm-list{display:flex;flex-direction:column;gap:.9rem}
.qblock{background:var(--s1);border:1px solid var(--b1);border-radius:11px;padding:1.1rem}
.q-txt{font-family:'Lora',serif;font-size:.88rem;color:var(--tx);margin-bottom:.9rem;line-height:1.6;font-style:italic}
.q-opts{display:flex;flex-direction:column;gap:5px}
.q-opt{padding:9px 13px;border-radius:7px;border:1px solid var(--b1);background:var(--s2);cursor:pointer;font-size:.76rem;color:var(--tx2);transition:all .2s;display:flex;align-items:center;gap:9px;text-align:left}
.q-opt:hover:not(.answered){border-color:var(--a1);color:var(--tx);background:rgba(99,179,237,.05)}
.q-opt.correct{border-color:var(--a3);background:rgba(104,211,145,.08);color:var(--a3)}
.q-opt.wrong{border-color:var(--a4);background:rgba(252,129,129,.08);color:var(--a4)}
.q-opt.rev-ok{border-color:rgba(104,211,145,.35);background:rgba(104,211,145,.04);color:var(--a3);opacity:.7}
.opt-lt{width:20px;height:20px;border-radius:50%;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;flex-shrink:0;color:var(--tx2)}
.q-fb{margin-top:.7rem;padding:9px 13px;border-radius:7px;font-size:.73rem;line-height:1.5;display:none}
.q-fb.show{display:block;animation:fsi .3s ease}
.q-fb.ok{background:rgba(104,211,145,.06);border:1px solid rgba(104,211,145,.18);color:var(--a3)}
.q-fb.ko{background:rgba(252,129,129,.06);border:1px solid rgba(252,129,129,.18);color:var(--a4)}

/* TIMELINE */
.tl{position:relative;padding-left:1.8rem}
.tl::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--a1),var(--a5),transparent)}
.tl-item{position:relative;margin-bottom:1rem}
.tl-dot{position:absolute;left:-1.8rem;top:4px;width:11px;height:11px;border-radius:50%;background:var(--a1);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--a1)}
.tl-c{background:var(--s1);border:1px solid var(--b1);border-radius:9px;padding:9px 13px;font-size:.76rem;color:var(--tx2);line-height:1.6}
.tl-c strong{color:var(--tx);display:block;margin-bottom:2px}

/* NOTIF */
.notif{position:fixed;top:68px;right:1.2rem;background:var(--s2);border:1px solid var(--b1);border-radius:9px;padding:9px 15px;font-size:.73rem;color:var(--tx);z-index:300;transform:translateX(120%);transition:transform .3s;box-shadow:0 8px 25px rgba(0,0,0,.3)}
.notif.show{transform:translateX(0)}
.notif.ok{border-color:rgba(104,211,145,.4)}
.notif.ko{border-color:rgba(252,129,129,.4)}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--mt);border-radius:2px}
@media(max-width:600px){.cgrid{grid-template-columns:1fr 1fr;padding:0 1rem 1rem}.main{padding:0 1rem 3rem}header{padding:0 1rem}.hero{padding:2.5rem 1rem 1.5rem}}
</style>
</head>
<body>

<div class="notif" id="notif"></div>

<header>
  <div class="logo"><div class="pulse"></div>RÉANIMATION</div>
  <div class="hdr-r">
    <span class="sc-badge" id="gScore">Score: 0 / 0</span>
    <div class="prog-wrap"><div class="prog-fill" id="gProg"></div></div>
  </div>
</header>

<div class="hero">
  <p class="hero-eye">Plateforme de Révision Médicale</p>
  <h1 class="hero-title">Réanimation<br>Médicale</h1>
  <p class="hero-sub">Cours complets tirés de vos notes, QCM, flashcards et outils interactifs. Sélectionnez un module pour commencer.</p>
</div>

<div class="cgrid" id="cgrid"></div>

<div class="empty" id="empty">
  <div class="empty-icon">🩺</div>
  <div class="empty-title">Choisissez un cours ci-dessus</div>
  <div class="empty-sub">11 modules · QCM · Flashcards · Calculateur GCS</div>
</div>

<div class="main" id="main" style="display:none">
  <div class="ch">
    <div class="ch-icon" id="chIcon"></div>
    <div><h2 id="chTitle"></h2><p class="sub" id="chSub"></p></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
</div>

<script>

],
qcm:[

function buildGrid(){
  const g=document.getElementById('cgrid');
  C.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='ccard';el.id='cc-'+c.id;
    el.style.setProperty('--cc',c.color);
    el.innerHTML=`<span class="ccard-icon">${c.icon}</span><div class="ccard-num">MODULE ${String(i+1).padStart(2,'0')}</div><div class="ccard-title">${c.title}</div><div class="ccard-prog"><div class="ccard-prog-f" id="cp-${c.id}"></div></div>`;
    el.onclick=()=>open(c.id);
    g.appendChild(el);
  });
}

// ═══════════════════════════ OPEN COURSE ═══════════════════════
function open(id){
  const c=C.find(x=>x.id===id);if(!c)return;
  S.cur=id;S.tab='cours';S.fc={idx:0,flipped:false};S.qcm={ans:{},ok:0,tot:0};S.gcs={e:0,v:0,m:0};
  document.querySelectorAll('.ccard').forEach(x=>x.classList.remove('active'));
  document.getElementById('cc-'+id)?.classList.add('active');
  document.getElementById('empty').style.display='none';
  const m=document.getElementById('main');m.style.display='block';
  document.getElementById('chIcon').textContent=c.icon;
  document.getElementById('chTitle').textContent=c.title;
  document.getElementById('chSub').textContent=c.sub;
  // Build tabs
  const tabs=['cours','flashcards','qcm'];
  const tl={'cours':'📖 Cours','flashcards':'🃏 Flashcards','qcm':'✅ QCM'};
  const tb=document.getElementById('tabs');tb.innerHTML='';
  tabs.forEach(t=>{
    const b=document.createElement('button');
    b.className='tbtn'+(t==='cours'?' active':'');b.dataset.t=t;
    b.textContent=tl[t];b.onclick=()=>switchTab(t);tb.appendChild(b);
  });
  renderAll(c);
  m.scrollIntoView({behavior:'smooth',block:'start'});
}

function switchTab(t){
  S.tab=t;
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.dataset.t===t));
}

// ═══════════════════════════ RENDER ALL ═══════════════════════
function renderAll(c){
  const p=document.getElementById('panels');p.innerHTML='';
  p.appendChild(buildCoursPanel(c));
  p.appendChild(buildFCPanel(c));
  p.appendChild(buildQCMPanel(c));
}

// ─── COURS ───
function buildCoursPanel(c){
  const p=mk('div','panel active');p.dataset.t='cours';
  let h='<div class="cgr">';
  c.cours.forEach(sec=>{
    const fw=sec.fw?' fw':'';
    h+=`<div class="cb${fw}"><div class="bt" style="--a1:${C.find(x=>x.id===c.id).color}">${sec.t}</div>`;
    if(sec.schema) h+=`<div class="schema">${sec.schema}</div>`;
    if(sec.table){
      h+='<div style="overflow-x:auto"><table class="stbl"><thead><tr>'+sec.table.headers.map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>';
      sec.table.rows.forEach(r=>{ h+='<tr>'+r.map(x=>`<td>${x}</td>`).join('')+'</tr>'; });
      h+='</tbody></table></div>';
    }
    if(sec.items) h+='<ul class="il">'+sec.items.map(x=>`<li>${x}</li>`).join('')+'</ul>';
    h+='</div>';
  });
  // GCS calculator for TC
  if(c.id==='tc'){
    h+=`</div><div class="cb fw" style="margin-bottom:.9rem">
<div class="bt" style="--a1:#b794f4">🧮 Calculateur GCS Interactif</div>
<div class="gcs-grid">
  <div class="gcs-sec"><div class="gcs-stit">Ouverture des yeux (E)</div>
    ${[['Spontanée',4],['Au bruit',3],['À la douleur',2],['Absente',1]].map(([l,s])=>`<div class="gcs-row" onclick="gcsSet('e',${s},this)"><span>${l}</span><span class="gcs-badge">${s}</span></div>`).join('')}
  </div>
  <div class="gcs-sec"><div class="gcs-stit">Réponse verbale (V)</div>
    ${[['Orientée',5],['Confuse',4],['Inappropriée',3],['Incompréhensible',2],['Absente',1]].map(([l,s])=>`<div class="gcs-row" onclick="gcsSet('v',${s},this)"><span>${l}</span><span class="gcs-badge">${s}</span></div>`).join('')}
  </div>
  <div class="gcs-sec"><div class="gcs-stit">Réponse motrice (M)</div>
    ${[['Obéit',6],['Adaptée',5],['Orientée',4],['Flexion réflexe',3],['Extension réflexe',2],['Absente',1]].map(([l,s])=>`<div class="gcs-row" onclick="gcsSet('m',${s},this)"><span>${l}</span><span class="gcs-badge">${s}</span></div>`).join('')}
  </div>
</div>
<div class="gcs-total" id="gcsTot"><div class="gcs-num" id="gcsNum">—</div><div class="gcs-lbl" id="gcsLbl">Sélectionnez les critères</div></div>
</div><div class="cgr">`;
  }
  h+='</div>';
  p.innerHTML=h;return p;
}

// ─── FLASHCARDS ───
function buildFCPanel(c){
  const p=mk('div','panel');p.dataset.t='flashcards';
  const cards=c.fc;
  p.innerHTML=`
<div class="fc-wrap">
  <div class="fc" id="fcCard" onclick="fcFlip()">
    <div class="fc-face fc-front"><div class="fc-lbl">❓ QUESTION</div><div class="fc-q" id="fcQ">${cards[0].q}</div><div class="fc-hint">Cliquez pour révéler la réponse</div></div>
    <div class="fc-face fc-back"><div class="fc-lbl">✅ RÉPONSE</div><div class="fc-a" id="fcA">${cards[0].a}</div></div>
  </div>
</div>
<div class="fc-nav">
  <button class="btn btn-sec" onclick="fcPrev()">← Préc.</button>
  <span class="fc-ctr" id="fcCtr">1 / ${cards.length}</span>
  <button class="btn btn-sec" onclick="fcNext()">Suiv. →</button>
</div>
<div class="fc-btns">
  <button class="btn btn-ok" onclick="fcMark(true)">✓ Je sais</button>
  <button class="btn btn-ko" onclick="fcMark(false)">✗ À revoir</button>
</div>
<div style="margin-top:.9rem;text-align:center;font-size:.65rem;color:var(--mt)">${cards.length} cartes au total · Cliquez pour retourner</div>`;
  return p;
}

// ─── QCM ───
function buildQCMPanel(c){
  const p=mk('div','panel');p.dataset.t='qcm';
  const qs=c.qcm;
  let h=`<div class="qcm-hd">
<span>Score QCM</span><span class="qcm-score-n" id="qScore">0</span><span>/ ${qs.length}</span>
<div style="flex:1;height:3px;background:var(--s3);border-radius:2px;margin-left:9px;overflow:hidden"><div id="qBar" style="height:100%;width:0%;background:linear-gradient(90deg,var(--a3),var(--a1));border-radius:2px;transition:width .4s"></div></div>
<button class="btn btn-sec" style="margin-left:auto;font-size:.65rem;padding:5px 11px" onclick="resetQCM()">↺ Reset</button>
</div><div class="qcm-list">`;
  qs.forEach((q,qi)=>{
    h+=`<div class="qblock" id="qb${qi}"><div class="q-txt"><strong style="color:var(--a1);font-style:normal">Q${qi+1}.</strong> ${q.q}</div><div class="q-opts">`;
    q.opts.forEach((o,oi)=>{
      h+=`<div class="q-opt" id="o${qi}_${oi}" onclick="qAnswer(${qi},${oi})"><span class="opt-lt">${['A','B','C','D'][oi]}</span><span>${o}</span></div>`;
    });
    h+=`</div><div class="q-fb" id="fb${qi}"></div></div>`;
  });
  h+='</div>';p.innerHTML=h;return p;
}

// ═══════════════════════════ GCS ═══════════════════════════
window.gcsSet=function(type,score,el){
  el.closest('.gcs-sec').querySelectorAll('.gcs-row').forEach(r=>r.classList.remove('sel'));
  el.classList.add('sel');S.gcs[type]=score;
  const t=S.gcs.e+S.gcs.v+S.gcs.m;
  const n=document.getElementById('gcsNum'),l=document.getElementById('gcsLbl');
  if(!n)return;
  if(S.gcs.e&&S.gcs.v&&S.gcs.m){
    n.textContent=t+'/15';
    n.className='gcs-num '+(t<=8?'c-sev':t<=12?'c-mod':'c-ok');
    l.textContent=t<=8?'🔴 Coma grave → IOT + Ventilation immédiate':t<=12?'🟡 Surveillance neurologique renforcée':'🟢 État de conscience satisfaisant';
  }
};

// ═══════════════════════════ FLASHCARDS ═══════════════════════
window.fcFlip=function(){
  S.fc.flipped=!S.fc.flipped;
  document.getElementById('fcCard')?.classList.toggle('flipped',S.fc.flipped);
};
window.fcNext=function(){
  const c=C.find(x=>x.id===S.cur);if(!c)return;
  S.fc.idx=(S.fc.idx+1)%c.fc.length;updFC(c.fc);
};
window.fcPrev=function(){
  const c=C.find(x=>x.id===S.cur);if(!c)return;
  S.fc.idx=(S.fc.idx-1+c.fc.length)%c.fc.length;updFC(c.fc);
};
window.fcMark=function(k){
  notif(k?'✓ Excellent !':'📌 Ajouté à revoir',k?'ok':'ko');
  window.fcNext();
};
function updFC(cards){
  S.fc.flipped=false;
  document.getElementById('fcCard')?.classList.remove('flipped');
  const q=document.getElementById('fcQ'),a=document.getElementById('fcA'),ctr=document.getElementById('fcCtr');
  if(q)q.textContent=cards[S.fc.idx].q;
  if(a)a.textContent=cards[S.fc.idx].a;
  if(ctr)ctr.textContent=`${S.fc.idx+1} / ${cards.length}`;
}

// ═══════════════════════════ QCM ═══════════════════════════
window.qAnswer=function(qi,oi){
  const c=C.find(x=>x.id===S.cur);if(!c)return;
  if(S.qcm.ans[qi]!==undefined)return;
  S.qcm.ans[qi]=oi;
  const q=c.qcm[qi];const ok=oi===q.c;
  q.opts.forEach((_,idx)=>{
    const el=document.getElementById(`o${qi}_${idx}`);if(!el)return;
    el.classList.add('answered');
    if(idx===q.c)el.classList.add(ok&&idx===oi?'correct':'rev-ok');
    else if(idx===oi)el.classList.add('wrong');
  });
  const fb=document.getElementById('fb'+qi);
  if(fb){fb.className='q-fb show '+(ok?'ok':'ko');fb.innerHTML=(ok?'✅ Correct ! ':'❌ Incorrect. ')+q.ex;}
  // score
  const done=Object.keys(S.qcm.ans).length;
  const cor=Object.entries(S.qcm.ans).filter(([i,a])=>a===c.qcm[+i]?.c).length;
  const se=document.getElementById('qScore'),be=document.getElementById('qBar');
  if(se)se.textContent=cor;if(be)be.style.width=(done/c.qcm.length*100)+'%';
  S.gtot++;if(ok)S.gok++;
  document.getElementById('gScore').textContent=`Score: ${S.gok} / ${S.gtot}`;
  document.getElementById('gProg').style.width=Math.min(S.gtot*4,100)+'%';
  notif(ok?'✅ Bonne réponse !':'❌ Mauvaise réponse',ok?'ok':'ko');
};

window.resetQCM=function(){
  S.qcm={ans:{},ok:0,tot:0};
  const c=C.find(x=>x.id===S.cur);if(!c)return;
  const panels=document.getElementById('panels');
  const old=panels.querySelector('[data-t="qcm"]');
  const np=buildQCMPanel(c);
  if(old)panels.replaceChild(np,old);
  switchTab('qcm');
};

// ═══════════════════════════ HELPERS ═══════════════════════════
function mk(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}
let nTimer;
function notif(msg,type='ok'){
  const el=document.getElementById('notif');
  el.textContent=msg;el.className=`notif ${type} show`;
  clearTimeout(nTimer);nTimer=setTimeout(()=>el.classList.remove('show'),2200);
}

// INIT
buildGrid();
</script>
</body>
</html>
